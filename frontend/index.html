  <style>
    :root {

      --cream: #f8f2e7;

    .marquee-item::after { color: var(--gold); content: "✦"; font-size: .78rem; }

    section { position: relative; padding: 86px 0; }

        flame: '<path d="M17 3c1 6-4 7-3 12 1-2 3-3 5-4 4 5 4 10 1 14-4 5-13 3-14-4-1-5 2-9 6-13 0 5 2 6 2 6 0-5 3-7 3-11Z"/><path d="M14 28c-2-2-1-5 2-8 3 4 3 6 1 8"/>',
        check: '<path d="M16 3 27 8v8c0 7-5 11-11 13C10 27 5 23 5 16V8l11-5Z"/><path d="m11 16 4 4 7-8"/>',
        jar: '<path d="M10 6h12v4l3 3v13H7V13l3-3V6Zm0 4h12m-15 4h18"/><path d="M12 18h8"/>',
        home: '<path d="m4 14 12-10 12 10v13H4V14Z"/><path d="M12 27V17h8v10"/>',
        sparkle: '<path d="m16 3 2.5 9.5L28 16l-9.5 2.5L16 28l-2.5-9.5L4 16l9.5-3.5L16 3Z"/><path d="m25 3 .8 3.2L29 7l-3.2.8L25 11l-.8-3.2L21 7l3.2-.8L25 3Z"/>',
        package: '<path d="m16 3 12 6v14l-12 6-12-6V9l12-6Z"/><path d="m4 9 12 6 12-6M16 15v14m-6-23 12 6"/>',
        chat: '<path d="M27 15a11 11 0 0 1-11 11 12 12 0 0 1-5-.9L5 27l1.8-5A11 11 0 1 1 27 15Z"/><path d="M11 12c1 4 4 7 8 8l2-2-3-2-2 1c-1-1-2-2-3-3l1-2-2-3-1 1Z"/>',
        email: '<rect x="3" y="6" width="26" height="20" rx="3"/><path d="m4 9 12 9L28 9"/>'
      }
    };

    const byId = (id) => document.getElementById(id);
    const icon = (name, className = "icon") => `<svg class="${className}" viewBox="0 0 32 32" aria-hidden="true">${CONFIG.icons[name] || CONFIG.icons.sparkle}</svg>`;

    const setText = (id, value) => { byId(id).textContent = value; };
    const makeLink = (label, href) => {
      const link = document.createElement("a");
      link.textContent = label;
      link.href = href;
      return link;
    };

    document.title = CONFIG.seo.title;
    byId("meta-description").content = CONFIG.seo.description;
    byId("og-title").content = CONFIG.seo.title;
    byId("og-description").content = CONFIG.seo.description;
    byId("og-url").content = CONFIG.seo.siteUrl;
    setText("skip-link", CONFIG.ui.skipLink);
    byId("brand-mark").src = CONFIG.logoImage;
    byId("header-brand").setAttribute("aria-label", `${CONFIG.brandHindi} — ${CONFIG.ui.homeLinkLabel}`);
    byId("hero-logo-image").src = CONFIG.logoImage;
    byId("favicon").href = CONFIG.logoImage;
    document.querySelector('meta[property="og:image"]').content = CONFIG.logoImage;
    byId("primary-nav").setAttribute("aria-label", CONFIG.ui.navLabel);
    setText("announcement-text", CONFIG.announcement);
    byId("announcement-close").setAttribute("aria-label", CONFIG.ui.dismissAnnouncement);
    byId("nav-backdrop").setAttribute("aria-label", CONFIG.ui.backdropLabel);
    byId("trust-strip").setAttribute("aria-label", CONFIG.ui.trustStripLabel);
    byId("tagline-strip").setAttribute("aria-label", CONFIG.ui.taglineStripLabel);
    byId("reviews-carousel").setAttribute("aria-label", CONFIG.ui.carouselLabel);
    byId("review-previous").setAttribute("aria-label", CONFIG.ui.previousReview);
    byId("review-next").setAttribute("aria-label", CONFIG.ui.nextReview);
    setText("brand-name", CONFIG.brandHindi);
    setText("brand-english", CONFIG.brand);
    byId("primary-nav").innerHTML = CONFIG.nav.map((item) => `<a href="${item.href}">${item.label}</a>`).join("");
    byId("header-whatsapp").href = whatsappUrl();
    setText("header-whatsapp", CONFIG.ui.headerWhatsapp);
    setText("menu-toggle", "☰");
    byId("menu-toggle").setAttribute("aria-label", CONFIG.ui.openMenu);
    byId("hero-whatsapp").href = whatsappUrl();
    setText("hero-whatsapp", CONFIG.ui.heroWhatsapp);
    byId("hero-email").href = `mailto:${CONFIG.contacts.email}`;
    setText("hero-email", CONFIG.ui.heroEmail);
    byId("floating-whatsapp").href = whatsappUrl();
    byId("floating-whatsapp").setAttribute("aria-label", CONFIG.ui.floatingWhatsapp);
    setText("hero-eyebrow", CONFIG.hero.eyebrow);
    byId("hero-title").innerHTML = CONFIG.hero.title;
    setText("hero-copy", CONFIG.hero.copy);

    const trustGroupMarkup = CONFIG.trustPoints.map((point) => `<span class="marquee-item">${point}</span>`).join("");
    byId("trust-marquee").innerHTML = `<div class="marquee-group">${trustGroupMarkup}</div><div class="marquee-group" aria-hidden="true">${trustGroupMarkup}</div>`;

    setText("ghee-eyebrow", CONFIG.ghee.eyebrow);
    setText("ghee-title", CONFIG.ghee.title);
    setText("ghee-intro", CONFIG.ghee.intro);
    byId("products-grid").innerHTML = CONFIG.ghee.products.map((product, index) => {
      const message = product.whatsappText;
      const buttonText = CONFIG.ghee.orderButton.replace("{SIZE}", product.size);
      const gradientId = `jar-gold-${index}`;
      return `<article class="product-card" data-reveal>
        <div class="product-art" style="--arch-angle:${product.archAngle}">
          <svg class="product-jar" viewBox="0 0 160 180" aria-hidden="true">
            <defs>
              <linearGradient id="${gradientId}" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#F9D96C"/>
                <stop offset="1" stop-color="#D99A22"/>
              </linearGradient>
            </defs>
            <rect x="39" y="24" width="82" height="25" rx="7" fill="#A9722B"/>
            <path d="M47 24v-5q0-5 5-5h56q5 0 5 5v5" fill="#A9722B" stroke="#8E5B20" stroke-width="2"/>
            <rect x="30" y="43" width="100" height="119" rx="19" fill="url(#${gradientId})" stroke="#FFF9E9" stroke-width="9"/>
            <rect x="45" y="78" width="70" height="53" rx="8" fill="#FFF6DD" stroke="#E8D8B1" stroke-width="1.5"/>
            <text x="80" y="100" text-anchor="middle" fill="#563A20" font-family="Georgia,serif" font-size="12" font-weight="700">PURE</text>
            <text x="80" y="117" text-anchor="middle" fill="#563A20" font-family="Georgia,serif" font-size="12" font-weight="700">GHEE</text>
          </svg>
        </div>
        <div class="product-details">
          <h3>${product.size}</h3>
          <p class="product-price">Price: ${product.price}</p>
          <a class="button button--small" href="${whatsappUrl(message)}" target="_blank" rel="noopener noreferrer">${buttonText}</a>
        </div>
      </article>`;
    }).join("");

    byId("stats-grid").innerHTML = CONFIG.stats.items.map((stat) => {
      const display = stat.display || (stat.value === null ? "[Add number]" : String(stat.value));
      const target = stat.value === null ? "" : ` data-count-target="${stat.value}" data-count-suffix="${stat.suffix || ""}"`;
      return `<div class="stat" data-reveal><span class="stat-number"${target}>${display}</span><span class="stat-label">${stat.label}</span></div>`;
    }).join("");

    setText("about-eyebrow", CONFIG.about.eyebrow);
    setText("about-title", CONFIG.about.title);
    byId("about-copy").innerHTML = CONFIG.about.paragraphs.map((paragraph) => `<p class="section-copy">${paragraph}</p>`).join("");
    if (CONFIG.about.labReport.url) {
      const labCard = byId("lab-card");
      labCard.hidden = false;
      labCard.classList.add("is-visible");
      setText("lab-title", CONFIG.about.labReport.title);
      setText("lab-description", CONFIG.about.labReport.description);
      setText("lab-link", CONFIG.about.labReport.button);
      byId("lab-link").href = CONFIG.about.labReport.url;
    }

    setText("journey-eyebrow", CONFIG.journey.eyebrow);
    setText("journey-title", CONFIG.journey.title);
    setText("journey-intro", CONFIG.journey.intro);
    byId("timeline").innerHTML = CONFIG.journey.steps.map((step, index) => `<li class="timeline-item" data-reveal style="--reveal-delay:${(index % 2) * 90}ms">
      <article class="timeline-card">
        <span class="timeline-icon">${icon(step.icon)}</span>
        <h3>${step.title}</h3>
        <p>${step.description}</p>
      </article>
    </li>`).join("");

    setText("why-eyebrow", CONFIG.why.eyebrow);
    setText("why-title", CONFIG.why.title);
    setText("why-intro", CONFIG.why.intro);
    byId("why-grid").innerHTML = CONFIG.why.items.map((item) => `<article class="why-card" data-reveal>${icon(item.icon)}<h3>${item.title}</h3><p>${item.description}</p></article>`).join("");

    setText("reviews-eyebrow", CONFIG.reviews.eyebrow);
    setText("reviews-title", CONFIG.reviews.title);
    setText("reviews-intro", CONFIG.reviews.intro);
    let activeReview = 0;
    const renderReview = () => {
      const review = CONFIG.reviews.items[activeReview];
      byId("testimonial-card").innerHTML = `<div class="testimonial-mark" aria-hidden="true">“</div><blockquote class="testimonial-text">${review.text}</blockquote><p class="testimonial-author">${review.author}</p>`;
      setText("review-status", `${activeReview + 1} / ${CONFIG.reviews.items.length}`);
    };
    const changeReview = (offset) => {
      activeReview = (activeReview + offset + CONFIG.reviews.items.length) % CONFIG.reviews.items.length;
      renderReview();
    };
    byId("review-previous").addEventListener("click", () => changeReview(-1));
    byId("review-next").addEventListener("click", () => changeReview(1));
    renderReview();

    setText("faq-eyebrow", CONFIG.faq.eyebrow);
    setText("faq-title", CONFIG.faq.title);
    setText("faq-intro", CONFIG.faq.intro);
    byId("faq-list").innerHTML = CONFIG.faq.items.map((item) => `<details class="faq-item" data-reveal><summary>${item.question}</summary><p>${item.answer}</p></details>`).join("");

    const tagline = `${CONFIG.taglineStrip} `;
    byId("tagline-track").innerHTML = `<span class="tagline-text">${tagline.repeat(2)}</span><span class="tagline-text" aria-hidden="true">${tagline.repeat(2)}</span>`;

    setText("contact-eyebrow", CONFIG.contact.eyebrow);
    setText("contact-title", CONFIG.contact.title);
    setText("contact-intro", CONFIG.contact.intro);
    setText("form-title", CONFIG.contact.formTitle);
    setText("form-note", CONFIG.contact.formNote);
    setText("name-label", CONFIG.contact.nameLabel);
    setText("email-label", CONFIG.contact.emailLabel);
    setText("message-label", CONFIG.contact.messageLabel);
    setText("form-whatsapp", CONFIG.contact.whatsappButton);
    setText("form-email", CONFIG.contact.emailButton);
    byId("contact-options").innerHTML = `
      <a class="contact-card" href="${whatsappUrl()}" target="_blank" rel="noopener noreferrer">
        <span class="contact-card-icon">${icon("chat")}</span><span><strong>${CONFIG.ui.whatsappCardTitle}</strong><span>${CONFIG.ui.whatsappCardDescription}</span></span>
      </a>
      <a class="contact-card" href="mailto:${CONFIG.contacts.email}">
        <span class="contact-card-icon">${icon("email")}</span><span><strong>${CONFIG.ui.emailCardTitle}</strong><span>${CONFIG.contacts.email}</span></span>
      </a>`;
    byId("visitor-email").placeholder = CONFIG.contact.emailPlaceholder;
    byId("contact-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const formData = new FormData(form);
      const name = String(formData.get("name") || "").trim();
      const email = String(formData.get("email") || "").trim();
      const message = String(formData.get("message") || "").trim();
      const destination = event.submitter?.value;
      const error = byId("form-error");
      if (!name || !message) {
        setText("form-error", CONFIG.contact.validationMessage);
        (!name ? byId("visitor-name") : byId("visitor-message")).focus();
        return;
      }
      setText("form-error", "");
      const body = `Name: ${name}${email ? `\nEmail: ${email}` : ""}\n\n${message}`;
      if (destination === "email") {
        window.location.href = `mailto:${CONFIG.contacts.email}?subject=${encodeURIComponent(`Gauriganesh Ghee enquiry from ${name}`)}&body=${encodeURIComponent(body)}`;
      } else {
        window.open(whatsappUrl(`Hi Gauriganesh Ghee,\n\n${body}`), "_blank", "noopener,noreferrer");
      }
    });

    setText("footer-brand", CONFIG.brand);
    setText("footer-tagline", CONFIG.tagline);
    setText("footer-quick-title", CONFIG.footer.quickLinksTitle);
    setText("footer-contact-title", CONFIG.footer.contactTitle);
    setText("footer-social-title", CONFIG.footer.socialTitle);
    setText("footer-policy-title", CONFIG.footer.policiesTitle);
    byId("footer-quick-links").replaceChildren(...CONFIG.nav.map((item) => makeLink(item.label, item.href)));
    byId("footer-contact-links").replaceChildren(
      makeLink(CONFIG.ui.whatsappLabel, whatsappUrl()),
      makeLink(CONFIG.contacts.email, `mailto:${CONFIG.contacts.email}`)
    );
    byId("footer-social-links").replaceChildren(...CONFIG.footer.socialLinks.map((item) => makeLink(`${item.icon} ${item.name}`, item.url)));
    byId("footer-policy-links").replaceChildren(...CONFIG.footer.policyLinks.map((item) => makeLink(item.name, item.url)));
    setText("copyright", `© ${CONFIG.ui.year} ${CONFIG.brand}`);
    setText("footer-note", CONFIG.footer.footerNote);

    byId("announcement-close").addEventListener("click", () => byId("announcement").remove());

    const menuButton = byId("menu-toggle");
    const navigation = byId("primary-nav");
    const backdrop = byId("nav-backdrop");
    const closeMenu = () => {
      navigation.classList.remove("is-open");
      backdrop.classList.remove("is-open");
      menuButton.setAttribute("aria-expanded", "false");
      menuButton.setAttribute("aria-label", CONFIG.ui.openMenu);
      document.body.classList.remove("menu-open");
    };
    menuButton.addEventListener("click", () => {
      const willOpen = menuButton.getAttribute("aria-expanded") !== "true";
      navigation.classList.toggle("is-open", willOpen);
      backdrop.classList.toggle("is-open", willOpen);
      menuButton.setAttribute("aria-expanded", String(willOpen));
      menuButton.setAttribute("aria-label", willOpen ? CONFIG.ui.closeMenu : CONFIG.ui.openMenu);
      document.body.classList.toggle("menu-open", willOpen);
    });
    navigation.addEventListener("click", (event) => {
      if (event.target instanceof HTMLAnchorElement) closeMenu();
    });
    backdrop.addEventListener("click", closeMenu);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeMenu();
    });

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const revealElements = document.querySelectorAll("[data-reveal]");
    if (reduceMotion || !("IntersectionObserver" in window)) {
      revealElements.forEach((element) => element.classList.add("is-visible"));
    } else {
      const revealObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: .12 });
      revealElements.forEach((element) => revealObserver.observe(element));
    }

    const animateCounter = (element) => {
      const target = Number(element.dataset.countTarget);
      if (!Number.isFinite(target)) return;
      const suffix = element.dataset.countSuffix || "";
      const duration = 1000;
      const start = performance.now();
      const tick = (now) => {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        element.textContent = `${Math.round(target * eased).toLocaleString()}${suffix}`;
        if (progress < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    };
    if (!reduceMotion && "IntersectionObserver" in window) {
      const counterObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            animateCounter(entry.target);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: .65 });
      document.querySelectorAll("[data-count-target]").forEach((counter) => counterObserver.observe(counter));
    }
  </script>
</body>
